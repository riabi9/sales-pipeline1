<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سجل قياسات السكر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root {
    --bg: #EFF4EE;
    --surface: #FFFFFF;
    --ink: #1F2A24;
    --muted-ink: #5B6B60;
    --primary: #2F6D52;
    --primary-dark: #234F3C;
    --accent: #C98A3D;
    --border: #D9E3D6;
    --danger: #B5533C;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Tajawal', sans-serif;
    font-size: 18px;
    line-height: 1.6;
    padding: 24px 16px 64px;
  }
  .page { max-width: 480px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 28px; }
  header h1 { font-size: 1.6rem; font-weight: 700; margin: 0 0 6px; color: var(--primary-dark); }
  header .clock { color: var(--muted-ink); font-size: 0.95rem; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 24px;
  }
  label { display: block; font-weight: 500; margin-bottom: 8px; font-size: 1rem; }
  .field { margin-bottom: 18px; }
  input[type="number"], input[type="text"], input[type="datetime-local"], select, textarea {
    width: 100%;
    font-family: inherit;
    font-size: 1.15rem;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #FBFDFA;
    color: var(--ink);
  }
  #value {
    font-size: 1.8rem;
    font-weight: 700;
    text-align: center;
    padding: 16px;
  }
  textarea { resize: vertical; min-height: 60px; font-size: 1rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .chip {
    font-family: inherit;
    font-size: 0.95rem;
    padding: 9px 16px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: #FBFDFA;
    color: var(--ink);
    cursor: pointer;
  }
  .chip.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
    font-weight: 500;
  }
  .subtle-label { color: var(--muted-ink); font-size: 0.88rem; margin: -10px 0 12px; }
  button.save {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 10px;
    background: var(--primary);
    color: #fff;
    font-family: inherit;
    font-size: 1.2rem;
    font-weight: 700;
    cursor: pointer;
  }
  button.save:active { background: var(--primary-dark); }
  .feedback { text-align: center; margin-top: 12px; font-weight: 500; min-height: 1.4em; }
  .feedback.ok { color: var(--primary-dark); }
  .feedback.err { color: var(--danger); }
  .section-title { font-weight: 700; font-size: 1.1rem; margin: 0 0 14px; color: var(--primary-dark); }
  .entry {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    gap: 12px;
  }
  .entry:last-child { border-bottom: none; }
  .entry-value { font-size: 1.3rem; font-weight: 700; color: var(--primary-dark); min-width: 64px; }
  .entry-meta { flex: 1; font-size: 0.92rem; color: var(--muted-ink); }
  .entry-meta .context { color: var(--ink); font-weight: 500; }
  .delete-link, .edit-link {
    font-size: 0.88rem;
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    padding: 4px 6px;
    white-space: nowrap;
  }
  .delete-link { color: var(--danger); }
  .edit-link { color: var(--primary-dark); }
  .entry-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .empty { color: var(--muted-ink); text-align: center; padding: 12px 0; }
  canvas { max-width: 100%; }
  footer { text-align: center; color: var(--muted-ink); font-size: 0.8rem; margin-top: 8px; }
  .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .card-header .section-title { margin: 0; }
  .print-btn {
    font-family: inherit;
    font-size: 0.9rem;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--primary);
    background: #fff;
    color: var(--primary-dark);
    cursor: pointer;
  }
  .cancel-edit {
    display: block;
    width: 100%;
    text-align: center;
    background: none;
    border: none;
    color: var(--muted-ink);
    font-family: inherit;
    font-size: 0.95rem;
    padding: 10px;
    cursor: pointer;
  }
  @media print {
    #form-card, .print-btn, .edit-link, .delete-link, footer { display: none !important; }
    body { background: #fff; padding: 0; }
    .card { border: none; padding: 0; margin-bottom: 20px; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>سجل قياسات السكر</h1>
    <div class="clock" id="clock"></div>
  </header>

  <div class="card" id="form-card">
    <form id="entry-form">
      <div class="field">
        <label for="value">قيمة القراءة</label>
        <input type="number" id="value" inputmode="decimal" step="0.01" min="0" required>
      </div>
      <div class="field">
        <label for="entry-datetime">التاريخ والوقت</label>
        <input type="datetime-local" id="entry-datetime" required>
        <div class="subtle-label">معبأ تلقائيًا بالوقت الحالي — غيّريه إذا كانت القراءة من وقت سابق</div>
      </div>
      <div class="field">
        <label for="context">الوقت بالنسبة للأكل</label>
        <select id="context">
          <option value="صائم">صائم</option>
          <option value="قبل الأكل">قبل الأكل</option>
          <option value="بعد الأكل بساعتين">بعد الأكل بساعتين</option>
          <option value="قبل النوم">قبل النوم</option>
          <option value="أخرى">أخرى</option>
        </select>
      </div>
      <div class="field">
        <label for="weight">الوزن (كغ) - اختياري</label>
        <input type="number" id="weight" inputmode="decimal" step="0.1" min="0">
      </div>
      <div class="field">
        <label for="meal">ماذا أكلت؟ (اختياري)</label>
        <textarea id="meal" placeholder="مثال: طبق كسكسي وسلطة"></textarea>
      </div>
      <div class="field">
        <label>كيف تشعرين؟ (اختياري)</label>
        <div class="chips" id="feeling-chips">
          <button type="button" class="chip" data-label="بخير">بخير</button>
          <button type="button" class="chip" data-label="دوخة">دوخة</button>
          <button type="button" class="chip" data-label="تعب">تعب</button>
          <button type="button" class="chip" data-label="عطش شديد">عطش شديد</button>
          <button type="button" class="chip" data-label="جوع شديد">جوع شديد</button>
          <button type="button" class="chip" data-label="تعرّق">تعرّق</button>
          <button type="button" class="chip" data-label="ارتجاف">ارتجاف</button>
          <button type="button" class="chip" data-label="صداع">صداع</button>
          <button type="button" class="chip" data-label="غثيان">غثيان</button>
        </div>
        <div class="subtle-label">يمكنك اختيار أكثر من كلمة</div>
        <label for="notes">تفاصيل إضافية (اختياري)</label>
        <textarea id="notes" placeholder="اكتبي أي شيء آخر تريدين إضافته هنا"></textarea>
      </div>
      <button type="submit" class="save">حفظ القراءة</button>
      <button type="button" id="cancel-edit" class="cancel-edit" style="display:none;">إلغاء التعديل</button>
      <div class="feedback" id="feedback"></div>
    </form>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="section-title">آخر القراءات</div>
      <button type="button" class="print-btn" id="print-btn">طباعة</button>
    </div>
    <div id="history"></div>
  </div>

  <div class="card">
    <div class="section-title">الاتجاه خلال آخر القراءات</div>
    <canvas id="trend-chart" height="180"></canvas>
  </div>

  <div class="card">
    <div class="section-title">الوزن عبر الوقت</div>
    <canvas id="weight-chart" height="180"></canvas>
  </div>

  <footer>يُسجَّل التاريخ والوقت تلقائيًا مع كل قراءة</footer>
</div>

<script>
// ====== إعدادات Supabase ======
// انسخي نفس القيم المستخدمة في صفحات steel-platform (نفس المشروع، جدول جديد)
const SUPABASE_URL = "https://fmmfofjkebdsrnkchrfo.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZtbWZvZmprZWJkc3Jua2NocmZvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1MDAxNDIsImV4cCI6MjA5MjA3NjE0Mn0.bQQJt06mucLCQCrY1NgN-ed2ngDeRLmITmOfQCAM7ZU";
const TABLE_NAME = "sugar_readings";

let supabaseClient = null;
if (SUPABASE_URL.includes("PASTE_YOUR") || SUPABASE_ANON_KEY.includes("PASTE_YOUR")) {
  document.body.innerHTML =
    '<div style="max-width:480px;margin:60px auto;padding:20px;background:#fff;border:1px solid #B5533C;border-radius:12px;color:#1F2A24;font-family:sans-serif;text-align:center;">' +
    'لم يتم إعداد الاتصال بقاعدة البيانات بعد.<br><br>' +
    'افتحي هذا الملف وابحثي عن السطر الذي يحتوي على PASTE_YOUR_SUPABASE_URL_HERE واستبدليه برابط ومفتاح Supabase الحقيقيين (نفس القيم المستخدمة في صفحات steel-platform).' +
    '</div>';
  throw new Error("Supabase URL/key not configured — replace the placeholders near the top of the script.");
}

try {
  supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
} catch (e) {
  document.body.innerHTML =
    '<div style="max-width:480px;margin:60px auto;padding:20px;background:#fff;border:1px solid #B5533C;border-radius:12px;color:#1F2A24;font-family:sans-serif;text-align:center;">' +
    'تعذّر الاتصال بقاعدة البيانات. تأكدي من صحة رابط ومفتاح Supabase.' +
    '</div>';
  throw e;
}

function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleString('ar-DZ', { dateStyle: 'full', timeStyle: 'short' });
}
updateClock();
setInterval(updateClock, 1000 * 30);

const form = document.getElementById('entry-form');
const feedback = document.getElementById('feedback');
const historyEl = document.getElementById('history');
const datetimeInput = document.getElementById('entry-datetime');
let chartInstance = null;
let weightChartInstance = null;
let editingId = null;
const saveBtn = document.querySelector('.save');
const cancelEditBtn = document.getElementById('cancel-edit');

document.getElementById('print-btn').addEventListener('click', () => window.print());
cancelEditBtn.addEventListener('click', cancelEdit);

function toLocalDatetimeValue(date) {
  const pad = n => String(n).padStart(2, '0');
  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
}
datetimeInput.value = toLocalDatetimeValue(new Date());

const selectedFeelings = new Set();
document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    const label = chip.dataset.label;
    if (selectedFeelings.has(label)) {
      selectedFeelings.delete(label);
      chip.classList.remove('active');
    } else {
      selectedFeelings.add(label);
      chip.classList.add('active');
    }
  });
});

function resetFeelings() {
  selectedFeelings.clear();
  document.querySelectorAll('.chip').forEach(chip => chip.classList.remove('active'));
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const value = document.getElementById('value').value;
  const context = document.getElementById('context').value;
  const weight = document.getElementById('weight').value;
  const meal = document.getElementById('meal').value.trim();
  const details = document.getElementById('notes').value.trim();
  const feelings = [...selectedFeelings].join('، ');
  const notes = [feelings, details].filter(Boolean).join(' — ');

  feedback.textContent = "جارٍ الحفظ...";
  feedback.className = "feedback";

  const payload = {
    value: Number(value),
    context,
    weight: weight ? Number(weight) : null,
    meal: meal || null,
    notes: notes || null,
    created_at: new Date(datetimeInput.value).toISOString()
  };

  const { error } = editingId
    ? await supabaseClient.from(TABLE_NAME).update(payload).eq('id', editingId)
    : await supabaseClient.from(TABLE_NAME).insert([payload]);

  if (error) {
    feedback.textContent = "حدث خطأ أثناء الحفظ. تحقّقي من الاتصال بالإنترنت.";
    feedback.className = "feedback err";
    console.error(error);
    return;
  }

  feedback.textContent = editingId ? "تم التحديث ✅" : "تم الحفظ ✅";
  feedback.className = "feedback ok";
  editingId = null;
  saveBtn.textContent = "حفظ القراءة";
  cancelEditBtn.style.display = "none";
  form.reset();
  resetFeelings();
  datetimeInput.value = toLocalDatetimeValue(new Date());
  loadHistory();
});

async function startEdit(id) {
  const { data, error } = await supabaseClient.from(TABLE_NAME).select('*').eq('id', id).single();
  if (error || !data) {
    alert("تعذّر تحميل هذه القراءة.");
    console.error(error);
    return;
  }
  editingId = id;
  document.getElementById('value').value = data.value;
  datetimeInput.value = toLocalDatetimeValue(new Date(data.created_at));
  document.getElementById('context').value = data.context || 'صائم';
  document.getElementById('weight').value = data.weight ?? '';
  document.getElementById('meal').value = data.meal || '';
  document.getElementById('notes').value = data.notes || '';
  resetFeelings();
  saveBtn.textContent = "تحديث القراءة";
  cancelEditBtn.style.display = "block";
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function cancelEdit() {
  editingId = null;
  form.reset();
  resetFeelings();
  datetimeInput.value = toLocalDatetimeValue(new Date());
  saveBtn.textContent = "حفظ القراءة";
  cancelEditBtn.style.display = "none";
}

async function loadHistory() {
  const { data, error } = await supabaseClient
    .from(TABLE_NAME)
    .select('*')
    .order('created_at', { ascending: false })
    .limit(50);

  if (error) {
    historyEl.innerHTML = '<div class="empty">تعذّر تحميل السجل.</div>';
    console.error(error);
    return;
  }

  if (!data || data.length === 0) {
    historyEl.innerHTML = '<div class="empty">لا توجد قراءات بعد.</div>';
    updateChart([]);
    updateWeightChart([]);
    return;
  }

  historyEl.innerHTML = data.map(row => {
    const d = new Date(row.created_at);
    const dateStr = d.toLocaleString('ar-DZ', { dateStyle: 'medium', timeStyle: 'short' });
    return `
      <div class="entry">
        <div class="entry-value">${row.value}</div>
        <div class="entry-meta">
          <span class="context">${row.context || ''}</span><br>
          ${dateStr}
          ${row.weight ? `<br>الوزن: ${row.weight} كغ` : ''}
          ${row.meal ? `<br>الأكل: ${row.meal}` : ''}
          ${row.notes ? `<br>${row.notes}` : ''}
        </div>
        <div class="entry-actions">
          <button class="edit-link" onclick="startEdit('${row.id}')">تعديل</button>
          <button class="delete-link" onclick="deleteEntry('${row.id}')">حذف</button>
        </div>
      </div>
    `;
  }).join('');

  updateChart([...data].reverse());
  updateWeightChart([...data].reverse());
}

async function deleteEntry(id) {
  if (!confirm("هل تريدين حذف هذه القراءة؟")) return;
  const { error } = await supabaseClient.from(TABLE_NAME).delete().eq('id', id);
  if (error) {
    alert("تعذّر الحذف.");
    console.error(error);
    return;
  }
  loadHistory();
}

function updateChart(rows) {
  const ctx = document.getElementById('trend-chart');
  const labels = rows.map(r => new Date(r.created_at).toLocaleDateString('ar-DZ', { day: 'numeric', month: 'short' }));
  const values = rows.map(r => r.value);

  if (chartInstance) chartInstance.destroy();
  chartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        data: values,
        borderColor: '#2F6D52',
        backgroundColor: 'rgba(47,109,82,0.12)',
        tension: 0.3,
        fill: true,
        pointRadius: 3
      }]
    },
    options: {
      plugins: { legend: { display: false } },
      scales: {
        x: { reverse: true },
        y: { beginAtZero: false }
      }
    }
  });
}

function updateWeightChart(rows) {
  const weighed = rows.filter(r => r.weight !== null && r.weight !== undefined);
  const ctx = document.getElementById('weight-chart');
  const labels = weighed.map(r => new Date(r.created_at).toLocaleDateString('ar-DZ', { day: 'numeric', month: 'short' }));
  const values = weighed.map(r => r.weight);

  if (weightChartInstance) weightChartInstance.destroy();
  weightChartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        data: values,
        borderColor: '#C98A3D',
        backgroundColor: 'rgba(201,138,61,0.12)',
        tension: 0.3,
        fill: true,
        pointRadius: 3
      }]
    },
    options: {
      plugins: { legend: { display: false } },
      scales: {
        x: { reverse: true },
        y: { beginAtZero: false }
      }
    }
  });
}

loadHistory();
</script>
</body>
</html>
